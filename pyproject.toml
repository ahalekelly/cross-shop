[project]
name = "storefront"
version = "0.1.0"
description = "Batch product discovery, detail, and anonymous shipping quotes for public storefronts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45,<47",
  "httpx>=0.28,<0.29",
  "platformdirs>=4,<5",
]

[project.scripts]
storefront = "storefront.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storefront"]

[tool.pytest.ini_options]
testpaths = ["tests"]
